spring.datasource.url=jdbc:mysql://localhost:3306/medicharm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080

# JWT
jwt.secret=change_this_secret_to_a_strong_random_value_which_should_be_longer_than_64_characters_for_production
jwt.expiration-ms=86400000

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================================
# Email (forgot-password reset links)
# ============================================================
# Fill these in with real SMTP credentials before forgot-password
# emails will actually send. Until then, EmailService logs the
# would-be email to the console instead of failing the request, so
# the rest of the app keeps working — see EmailService.java.
#
# Example for Gmail (requires a 16-character "App Password", not
# your normal Gmail password: https://myaccount.google.com/apppasswords):
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=your-address@gmail.com
#   spring.mail.password=your-16-char-app-password
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
#
# spring.mail.host=
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL of the running frontend, used to build the link inside
# password-reset emails (e.g. http://localhost:5173/reset-password?token=...).
# Change this to your real deployed frontend URL in production.
app.frontend-url=http://localhost:5173